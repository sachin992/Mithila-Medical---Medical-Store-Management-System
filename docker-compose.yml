services:
  postgres:
    image: postgres:16-alpine
    container_name: mithila_postgres
    environment:
      POSTGRES_DB: mithila_medical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mithila_medical"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend_fastapi
    container_name: mithila_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend_fastapi/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend_react
      args:
        VITE_API_BASE: http://localhost:8000/api
    container_name: mithila_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
